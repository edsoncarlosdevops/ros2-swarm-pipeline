# =============================================================================
# Reusable Workflow: Trivy Container Vulnerability Scan
# =============================================================================

name: Security Scan

on:
  workflow_call:

jobs:
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Docker image (amd64)
        uses: actions/download-artifact@v4
        with:
          name: ros2-swarm-image-amd64
          path: /tmp

      - name: Load Docker image
        run: |
          docker load -i /tmp/ros2-swarm-amd64.tar
          COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker tag ghcr.io/${{ github.repository }}:latest-amd64 ros2-swarm-pipeline:${COMMIT_SHA}

      - name: Run Trivy vulnerability scanner on Docker image
        run: |
          COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity HIGH,CRITICAL ros2-swarm-pipeline:${COMMIT_SHA}
