# =============================================================================
# ROS 2 Swarm Pipeline - CI/CD Orchestrator
#
# Main workflow that orchestrates reusable shared templates.
# Each job delegates to a dedicated reusable workflow, following the
# shared template pattern that Andrea Vergine described as a priority
# for the Swarm Team DevOps platform.
#
# Key design decisions:
#   1. Shared templates (reusable workflows) for DRY CI/CD
#   2. Composite actions for step-level reusability
#   3. Explicit dependency graph (needs) for pipeline efficiency
#   4. Matrix builds for multi-architecture (amd64 + arm64)
#
# Pipeline stages:
#   lint -> etl -> analyze         (data pipeline: MCAP -> Parquet -> DuckDB)
#   lint -> colcon-build           (C++ ROS 2 build with colcon)
#   lint -> docker-build -> integration (container validation)
# =============================================================================

name: ROS 2 Swarm Pipeline

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  # Stage 1: Code Quality - Flake8 lint on all Python ROS 2 nodes
  # --------------------------------------------------------------------------
  lint:
    name: Code Quality
    uses: ./.github/workflows/lint.yml
    with:
      python-version: "3.12"
      max-line-length: 100

  # --------------------------------------------------------------------------
  # Stage 2: Data Pipeline - Generate MCAP, convert to Parquet, validate
  # --------------------------------------------------------------------------
  etl:
    name: ETL Pipeline
    needs: lint
    uses: ./.github/workflows/etl-pipeline.yml
    with:
      python-version: "3.12"
      mcap-count: 500

  # --------------------------------------------------------------------------
  # Stage 3: Analytics - DuckDB SQL queries + Flight Report
  # --------------------------------------------------------------------------
  analyze:
    name: DuckDB Analytics
    runs-on: ubuntu-latest
    needs: etl

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python environment with pip cache
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
          requirements: etl_pipeline/requirements.txt

      - name: Cache data artifacts between runs
        uses: actions/cache@v4
        with:
          path: |
            data/raw/
            data/processed/
          key: ${{ runner.os }}-data-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-data-

      - name: Execute DuckDB analytical queries and generate flight report
        run: python etl_pipeline/analyze_flight.py --report

      - name: Validate analytics results with assertions
        run: python etl_pipeline/validate_analytics.py

      - name: Upload flight report artifact
        uses: actions/upload-artifact@v4
        with:
          name: flight-report
          path: data/processed/flight_report.md
          if-no-files-found: error
  # --------------------------------------------------------------------------
  # Stage 4: C++ Build - Compile ROS 2 C++ nodes with colcon
  # --------------------------------------------------------------------------
  colcon-build:
    name: C++ Colcon Build
    needs: lint
    uses: ./.github/workflows/colcon-build.yml
    with:
      ros-distro: "jazzy"
      package-path: "ros2_nodes/drone_bridge"

  # --------------------------------------------------------------------------
  # Stage 5: Docker Build - Multi-architecture container images (python + cpp)
  # --------------------------------------------------------------------------
  build-telemetry-pub-python:
    name: Build telemetry_pub_python (Docker)
    needs: lint
    uses: ./.github/workflows/docker-build.yml
    with:
      service-name: "telemetry_pub_python"
      dockerfile: "docker/Dockerfile"
      context: "."

  build-telemetry-sub-python:
    name: Build telemetry_sub_python (Docker)
    needs: build-telemetry-pub-python
    uses: ./.github/workflows/docker-build.yml
    with:
      service-name: "telemetry_sub_python"
      dockerfile: "docker/Dockerfile"
      context: "."

  build-waypoint-planner-python:
    name: Build waypoint_planner_python (Docker)
    needs: build-telemetry-pub-python
    uses: ./.github/workflows/docker-build.yml
    with:
      service-name: "waypoint_planner_python"
      dockerfile: "docker/Dockerfile"
      context: "."

  # --------------------------------------------------------------------------
  # Stage 6: Integration - Validate multi-node DDS communication
  # Tests: Python-Python DDS + Python-C++ cross-language DDS (telemetry_sub_cpp)
  # --------------------------------------------------------------------------
  integration:
    name: Docker Compose Integration
    runs-on: ubuntu-latest
    needs: [build-telemetry-pub-python, build-telemetry-sub-python, build-waypoint-planner-python]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Compose
        run: docker compose version

      - name: Start ROS 2 nodes and verify DDS communication
        run: |
          docker compose up -d
          sleep 5

          echo "=== Running containers ==="
          docker compose ps

          echo "=== Publisher node logs (Python, 10Hz) ==="
          docker compose logs telemetry_pub --tail 5

          echo "=== Subscriber node logs (Python, ETL) ==="
          docker compose logs telemetry_sub --tail 5

          echo "=== C++ Subscriber node logs (telemetry_sub_cpp - cross-language proof) ==="
          docker compose logs drone_bridge --tail 5

          echo "=== Waypoint Planner node logs (Python, navigation) ==="
          docker compose logs waypoint_planner --tail 5

          docker compose down

