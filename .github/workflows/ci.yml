# =============================================================================
# ROS 2 Swarm Pipeline - CI/CD Orchestrator
#
# Main workflow that orchestrates reusable shared templates.
# 100% of jobs delegate to dedicated reusable workflows (on: workflow_call),
# implementing the enterprise shared template pattern required for 
# robotics platform engineering.
#
# Pipeline stages:
#   lint -> etl -> analyze               (Data Pipeline & Analytics)
#   lint -> colcon-build                 (C++ ROS 2 colcon build with ccache)
#   lint -> docker-build -> security-scan -> integration (Container Pipeline)
# =============================================================================

name: ROS 2 Swarm Pipeline

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  # Stage 1: Code Quality (Shared Template)
  # --------------------------------------------------------------------------
  lint:
    name: Code Quality
    uses: ./.github/workflows/lint.yml
    with:
      python-version: "3.12"
      max-line-length: 100

  # --------------------------------------------------------------------------
  # Stage 2: Data Pipeline - MCAP -> Parquet (Shared Template)
  # --------------------------------------------------------------------------
  etl:
    name: ETL Pipeline
    needs: lint
    uses: ./.github/workflows/etl-pipeline.yml
    with:
      python-version: "3.12"
      mcap-count: 500

  # --------------------------------------------------------------------------
  # Stage 3: Analytics - DuckDB SQL Queries (Shared Template)
  # --------------------------------------------------------------------------
  analyze:
    name: DuckDB Analytics
    needs: etl
    uses: ./.github/workflows/analyze.yml

  # --------------------------------------------------------------------------
  # Stage 4: C++ Colcon Build (Shared Template)
  # --------------------------------------------------------------------------
  colcon-build:
    name: C++ Colcon Build
    needs: lint
    uses: ./.github/workflows/colcon-build.yml
    with:
      ros-distro: "jazzy"
      package-path: "ros2_nodes/drone_bridge"

  # --------------------------------------------------------------------------
  # Stage 5: Multi-architecture Docker Build (Shared Template)
  # --------------------------------------------------------------------------
  build-docker:
    name: Docker Build (multi-arch)
    needs: lint
    uses: ./.github/workflows/docker-build.yml

  # --------------------------------------------------------------------------
  # Stage 5.5: Container Vulnerability Scan (Shared Template)
  # --------------------------------------------------------------------------
  security-scan:
    name: Security Scan (Trivy)
    needs: [build-docker]
    uses: ./.github/workflows/security-scan.yml

  # --------------------------------------------------------------------------
  # Stage 6: Multi-node DDS Integration Test (Shared Template)
  # --------------------------------------------------------------------------
  integration:
    name: Docker Compose Integration
    needs: [security-scan]
    uses: ./.github/workflows/integration.yml
