# =============================================================================
# Reusable Workflow: Docker Multi-architecture Build
#
# Builds a SINGLE unified image containing all ROS 2 nodes
# (Python publisher, subscriber, waypoint planner + C++ bridge).
# The same image is used for all services — only the entry command differs.
#
# Matrix: amd64 (dev/CI) + arm64 (Jetson/drone edge devices)
# =============================================================================

name: Docker Multi-architecture Build

on:
  workflow_call:

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Build unified ROS 2 swarm image (${{ matrix.arch }})
        uses: ./.github/actions/docker-build
        with:
          arch: ${{ matrix.arch }}

      - name: Verify all ROS 2 nodes are present in image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:latest-${{ matrix.arch }}"
          echo "Verifying image: $IMAGE"

          # 1. Python package installed
          docker run --rm "$IMAGE" python3 -c "
          import importlib.util
          spec = importlib.util.find_spec('drone_telemetry')
          assert spec is not None, 'drone_telemetry package not found!'
          print('[OK] Python package: drone_telemetry')
          "

          # 2. Console scripts available
          docker run --rm "$IMAGE" which telemetry_pub_python && echo "[OK] telemetry_pub_python"
          docker run --rm "$IMAGE" which telemetry_sub_python && echo "[OK] telemetry_sub_python"
          docker run --rm "$IMAGE" which waypoint_planner_python && echo "[OK] waypoint_planner_python"

          # 3. C++ binary available
          docker run --rm "$IMAGE" bash -c "
          source /ros2_ws/install/setup.bash 2>/dev/null
          ros2 run drone_bridge telemetry_sub_cpp --help 2>&1 | head -1
          " && echo "[OK] C++ node: telemetry_sub_cpp"
      
      - name: Save Docker image as artifact
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:latest-${{ matrix.arch }}"
          docker save "$IMAGE" -o /tmp/ros2-swarm-${{ matrix.arch }}.tar
          echo "Image saved: $(ls -lh /tmp/ros2-swarm-${{ matrix.arch }}.tar)"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ros2-swarm-image-${{ matrix.arch }}
          path: /tmp/ros2-swarm-${{ matrix.arch }}.tar
          retention-days: 1