# =============================================================================
# Composite Action: Docker Build (single image, multi-arch via matrix)
#
# Builds the unified ROS 2 swarm image containing ALL nodes (Python + C++).
# Architecture is passed as input; the matrix strategy lives in the
# reusable workflow that calls this action.
# =============================================================================

name: Docker Build
description: Builds the ROS 2 swarm image for a single architecture

inputs:
  arch:
    description: Target architecture (amd64 or arm64)
    required: true
  dockerfile:
    description: Path to Dockerfile
    required: false
    default: docker/Dockerfile
  context:
    description: Build context
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Set up QEMU for cross-architecture emulation
      uses: docker/setup-qemu-action@v3
      with:
        platforms: ${{ inputs.arch }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ inputs.arch }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-${{ inputs.arch }}-

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: linux/${{ inputs.arch }}
        push: false
        load: true
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
        tags: |
          ghcr.io/${{ github.repository }}:latest-${{ inputs.arch }}
          ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ inputs.arch }}

    - name: Add Docker Build Summary to Job Summary
      shell: bash
      run: |
        COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        IMAGE="ghcr.io/${{ github.repository }}:latest-${{ inputs.arch }}"
        SIZE=$(docker image inspect "$IMAGE" --format='{{.Size}}' | awk '{printf "%.2f MB", $1/1024/1024}')
        
        echo "### 🐳 Docker Build Summary (${{ inputs.arch }})" >> $GITHUB_STEP_SUMMARY
        echo "| Attribute | Value |" >> $GITHUB_STEP_SUMMARY
        echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
        echo "| **Architecture** | \`${{ inputs.arch }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Commit Hash** | \`${COMMIT_SHA}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Image Size** | \`${SIZE}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Base OS** | Ubuntu 24.04 (ROS 2 Jazzy) |" >> $GITHUB_STEP_SUMMARY