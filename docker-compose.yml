# ============================================================================
# ROS 2 Swarm Pipeline - Docker Compose
#
# Simulates a drone fleet with ROS 2 nodes in Python AND C++ communicating:
#
#   telemetry_pub_python (Python, 10Hz) ──/drone/odometry──> waypoint_planner_python (Python)
#       │                                                   │
#       │                                                   └──/drone/cmd_vel──> (future)
#       │
#       ├──/drone/odometry──> telemetry_sub_python (Python)
#       │                           │
#       │                           └── Records MCAP (rosbag2_py) -> ETL -> Parquet -> DuckDB
#       │
#       └──/drone/odometry──> telemetry_sub_cpp (C++)
#                                     │
#                                     └── Cross-language DDS: Python -> C++
#
# Usage:
#   docker compose build
#   docker compose up
# ============================================================================

services:
  # --- Node 1: Publishes drone position (10Hz) - PYTHON (telemetry_pub_python) ---
  telemetry_pub:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: drone_telemetry_pub
    command: telemetry_pub_python
    networks:
      - ros2_swarm
    environment:
      - ROS_DOMAIN_ID=42
    healthcheck:
      test: ["CMD-SHELL", "source /opt/ros/jazzy/setup.bash && ros2 topic list 2>/dev/null | grep -q '/drone/odometry' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # --- Node 2: Subscribes to /drone/odometry and records MCAP for ETL - PYTHON (telemetry_sub_python) ---
  telemetry_sub:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: drone_telemetry_sub
    command: telemetry_sub_python
    depends_on:
      telemetry_pub:
        condition: service_healthy
    volumes:
      - ./data/raw:/ros2_ws/data/raw
    networks:
      - ros2_swarm
    environment:
      - ROS_DOMAIN_ID=42
      - TELEMETRY_DATA_DIR=/ros2_ws/data/raw

  # --- Node 3: Waypoint planner - PYTHON (waypoint_planner_python) ---
  waypoint_planner:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: waypoint_planner_python
    command: waypoint_planner_python
    depends_on:
      telemetry_pub:
        condition: service_healthy
    networks:
      - ros2_swarm
    environment:
      - ROS_DOMAIN_ID=42

  # --- Node 4: C++ Subscriber - CROSS-LANGUAGE PROOF (telemetry_sub_cpp) ---
  # telemetry_pub_python -> DDS (Fast DDS) -> telemetry_sub_cpp (cross-language proof)
  drone_bridge:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: telemetry_sub_cpp
    command: ros2 run drone_bridge telemetry_sub_cpp
    depends_on:
      telemetry_pub:
        condition: service_healthy
    networks:
      - ros2_swarm
    environment:
      - ROS_DOMAIN_ID=42

networks:
  ros2_swarm:
    driver: bridge
