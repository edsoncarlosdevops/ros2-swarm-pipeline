# ============================================================================
# ROS 2 Swarm Pipeline - Docker Compose
#
# Simula uma frota de drones com nodes ROS 2 em Python E C++ se comunicando:
#
#   telemetry_pub_python (Python, 10Hz) ──/drone/odometry──> waypoint_planner_python (Python)
#       │                                                   │
#       │                                                   └──/drone/cmd_vel──> (futuro)
#       │
#       └──/drone/odometry──> telemetry_sub_cpp (C++)
#                                     │
#                                     └── Cross-language DDS: Python → C++
#
# Para rodar:
#   docker compose build
#   docker compose up
# ============================================================================

services:
  # --- Node 1: Publica posicao do drone (10Hz) - PYTHON (telemetry_pub_python) ---
  telemetry_pub:
    build:
      context: .
      dockerfile: cicd/Dockerfile
    container_name: drone_telemetry_pub
    command: telemetry_pub_python
    networks:
      - ros2_swarm
    environment:
      - ROS_DOMAIN_ID=42

  # --- Node 2: Assina /drone/odometry e salva dados para ETL - PYTHON (telemetry_sub_python) ---
  telemetry_sub:
    build:
      context: .
      dockerfile: cicd/Dockerfile
    container_name: drone_telemetry_sub
    command: telemetry_sub_python
    depends_on:
      - telemetry_pub
    volumes:
      - ./data/raw:/ros2_ws/data/raw
    networks:
      - ros2_swarm
    environment:
      - ROS_DOMAIN_ID=42
      - TELEMETRY_DATA_DIR=/ros2_ws/data/raw

  # --- Node 3: Planejador de waypoints - PYTHON (waypoint_planner_python) ---
  waypoint_planner:
    build:
      context: .
      dockerfile: cicd/Dockerfile
    container_name: waypoint_planner_python
    command: waypoint_planner_python
    depends_on:
      - telemetry_pub
    networks:
      - ros2_swarm
    environment:
      - ROS_DOMAIN_ID=42

  # --- Node 4: Assinante C++ - PROVA CROSS-LANG (telemetry_sub_cpp) ---
  # telemetry_pub_python -> DDS (Fast DDS) -> telemetry_sub_cpp
  drone_bridge:
    build:
      context: .
      dockerfile: cicd/Dockerfile
    container_name: telemetry_sub_cpp
    command: ros2 run drone_bridge telemetry_sub_cpp
    depends_on:
      - telemetry_pub
    networks:
      - ros2_swarm
    environment:
      - ROS_DOMAIN_ID=42

networks:
  ros2_swarm:
    driver: bridge
