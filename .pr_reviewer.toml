[reviewer]
name = "AI PR Reviewer (ROS2 Specialist)"
model = "deepseek-chat"
provider = "deepseek"
severity_threshold = "low"

# Language of the feedback (e.g., "portuguese", "english", "spanish", "french", "german")
language = "portuguese"

[context]
extra_context_files = [
  "README.md"
]

[jira]
enabled = false
